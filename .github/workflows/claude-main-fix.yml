# ─────────────────────────────────────────────────────────────────────────────
# MANAGED-BY: Pioneer-Management-Consulting/github-claude-automations
# pioneer-stub-version: 2
# source: stubs/claude-main-fix.yml
# purpose: When any workflow fails on the default branch, Claude opens a PR with a fix
#
# DO NOT EDIT IN THIS REPOSITORY. Local edits are detected and reported as
# DIVERGED, and this repo then stops receiving updates.
# ─────────────────────────────────────────────────────────────────────────────
#
# `workflow_run` fires only for the copy of this file on the DEFAULT BRANCH, and
# always runs that copy - so a pull request can never change its own behaviour.
#
# `claude-code-action` rejects `workflow_run` outright ("Unsupported event type:
# workflow_run") - it is not in its supported event list, agent mode or not, and a
# reusable workflow inherits its caller's triggering event. So this file never
# calls claude-code-action directly from the `workflow_run` job. Instead the
# `relay` job below re-dispatches as `workflow_dispatch` - a supported event - and
# only the resulting `workflow_dispatch` run's `fix` job calls the reusable
# workflow. See main-failure-fix.yml for the rest of the logic.
#
# Step 7a of docs/SETUP.md confirmed `workflows:` must be listed explicitly - the
# omission does not mean "any workflow" on this org's setup. Because the filter
# only ever matches a workflow that actually exists in a given repo, this list is
# kept as a CENTRAL, GROWING SUPERSET of every real CI workflow name seen across
# the org - not a per-repo hand-edit. Adding a repo's real name here (`gh api
# repos/<repo>/actions/workflows --jq '.workflows[].name'`) keeps the stub
# byte-identical everywhere. Append names here; never fork this file per repo.
name: Claude Main Failure Fix

on:
  workflow_run:
    types: [completed]
    workflows: ["Deploy Production", "Probe A", "Azure Static Web Apps CI/CD"]
  workflow_dispatch:
    inputs:
      head_sha:
        required: true
        type: string
      trigger_name:
        required: false
        type: string

jobs:
  relay:
    name: Relay to workflow_dispatch
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      !startsWith(github.event.workflow_run.name, 'Claude ') &&
      !startsWith(github.event.workflow_run.head_branch, 'claude/')
    permissions:
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Re-dispatch as workflow_dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGER_NAME: ${{ github.event.workflow_run.name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          gh workflow run "${{ github.workflow }}" \
            --ref "$DEFAULT_BRANCH" \
            -f head_sha="$HEAD_SHA" \
            -f trigger_name="$TRIGGER_NAME"

  fix:
    name: Claude Main Failure Fix
    if: github.event_name == 'workflow_dispatch'
    # `id-token: write` MUST be declared here in the caller.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    uses: Pioneer-Management-Consulting/github-claude-automations/.github/workflows/main-failure-fix.yml@v2
    with:
      head_sha: ${{ inputs.head_sha }}
      trigger_name: ${{ inputs.trigger_name }}
    secrets: inherit
